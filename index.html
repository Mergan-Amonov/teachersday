<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ustozlar kuni muborak!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ====== SOZLAMALAR: shu yerni o'zgartiring ====== */
  :root {
    --bg1: #2b1d14;
    --bg2: #4a2c1a;
    --gold: #e8b95b;
    --cream: #fff8ec;
    --ink: #3b2a1e;
    --accent: #c8553d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', sans-serif;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%);
    color: var(--cream);
    overflow-x: hidden;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }

  /* Yaproqlar */
  #leaves { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .leaf {
    position: absolute; top: -40px; font-size: 24px;
    animation: fall linear forwards;
    will-change: transform;
  }
  @keyframes fall {
    to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); }
  }

  .stage { position: relative; z-index: 1; width: 100%; max-width: 560px; text-align: center; }

  /* Konvert */
  .envelope-wrap { cursor: pointer; transition: transform .3s; }
  .envelope-wrap:hover { transform: translateY(-4px); }
  .envelope {
    position: relative; width: 300px; height: 200px; margin: 0 auto;
    background: #d9a55b; border-radius: 6px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .envelope::before, .envelope::after {
    content: ""; position: absolute; bottom: 0; width: 0; height: 0;
    border-bottom: 110px solid #c98f45;
  }
  .envelope::before { left: 0; border-right: 150px solid transparent; }
  .envelope::after  { right: 0; border-left: 150px solid transparent; }
  .flap {
    position: absolute; top: 0; left: 0; width: 0; height: 0;
    border-left: 150px solid transparent; border-right: 150px solid transparent;
    border-top: 115px solid #e3b26b;
    transform-origin: top; transition: transform .6s ease;
    z-index: 3;
  }
  .seal {
    position: absolute; left: 50%; top: 92px; transform: translate(-50%, -50%);
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--accent); color: var(--cream);
    display: grid; place-items: center; font-size: 22px; z-index: 4;
    box-shadow: 0 3px 8px rgba(0,0,0,.3);
    transition: opacity .3s;
  }
  .hint { margin-top: 28px; font-size: 17px; opacity: .85; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  .opened .flap { transform: rotateX(180deg); z-index: 0; }
  .opened .seal { opacity: 0; }

  /* Tabrik kartasi */
  .card {
    display: none;
    background: var(--cream); color: var(--ink);
    border-radius: 18px; padding: 40px 28px 32px;
    box-shadow: 0 30px 70px rgba(0,0,0,.5);
    position: relative;
    border: 2px solid var(--gold);
    animation: rise .9s cubic-bezier(.2,.8,.2,1);
  }
  .card.show { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.95); } }
  .card::before {
    content: ""; position: absolute; inset: 10px;
    border: 1px dashed rgba(200,140,60,.5); border-radius: 12px; pointer-events: none;
  }
  .date { letter-spacing: 4px; font-size: 13px; color: var(--accent); font-weight: 600; text-transform: uppercase; }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 700;
    font-size: clamp(34px, 8vw, 48px); line-height: 1.1; margin: 10px 0 6px;
  }
  .to { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 24px; color: #8a5a2b; margin-bottom: 20px; }
  .message { font-size: 17px; line-height: 1.7; min-height: 9em; text-align: left; white-space: pre-line; }
  .cursor { display: inline-block; width: 2px; height: 1em; background: var(--ink); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .signature { margin-top: 22px; text-align: right; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; opacity: 0; transition: opacity 1s; }
  .signature.show { opacity: 1; }

  .actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 999px;
    padding: 10px 20px; cursor: pointer; transition: transform .15s;
  }
  button:active { transform: scale(.96); }
  .btn-main { background: var(--accent); color: #fff; }
  .btn-soft { background: #f1e2c8; color: var(--ink); }
  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .heart { position: absolute; bottom: -30px; font-size: 26px; animation: up 3s ease-out forwards; }
  @keyframes up { to { transform: translate(var(--dx), -110vh) scale(1.3); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .leaf, .heart, .hint { animation: none; display: none; }
  }
</style>
</head>
<body>
  <div id="leaves"></div>
  <div class="hearts" id="hearts"></div>

  <main class="stage">
    <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Konvertni ochish">
      <div class="envelope">
        <div class="flap"></div>
        <div class="seal">✉</div>
      </div>
      <p class="hint">Konvertni oching 💌</p>
    </div>

    <section class="card" id="card">
      <p class="date">1-oktabr · Ustozlar kuni</p>
      <h1>Ustozlar kuni muborak!</h1>
      <p class="to" id="to"></p>
      <p class="message"><span id="msg"></span><span class="cursor" id="cursor"></span></p>
      <p class="signature" id="sig"></p>
      <div class="actions">
        <button class="btn-main" id="love">Rahmat, ustoz! ❤</button>
        <button class="btn-soft" id="replay">Qayta o'qish</button>
      </div>
    </section>
  </main>

<script>
  // ====== MATNLARNI SHU YERDA O'ZGARTIRING ======
  const TEACHER = "Hurmatli ustozim";            // masalan: "Hurmatli Dilnoza opa"
  const FROM    = "Hurmat bilan, shogirdingiz"; // masalan: "Shogirdingiz Aziz"
  const MESSAGE =
`Sizni Ustozlar va murabbiylar kuni bilan chin qalbimdan tabriklayman!

Bergan bilimingiz, sabr-toqatingiz va har bir darsga qo'ygan mehringiz uchun katta rahmat. Siz nafaqat fanni, balki hayotni ham o'rgatdingiz.

Sizga mustahkam sog'liq, oilangizga baxt va tinchlik, ishlaringizga omad tilayman. Doim shunday nurli va ilhomli bo'ling!`;

  // Ismni havola orqali ham berish mumkin: index.html?name=Dilnoza%20opa
  const params = new URLSearchParams(location.search);
  const name = params.get("name");
  document.getElementById("to").textContent = name ? `Hurmatli ${name}` : TEACHER;
  document.getElementById("sig").textContent = params.get("from") || FROM;

  // Tushayotgan kuz yaproqlari
  const leafBox = document.getElementById("leaves");
  const leafIcons = ["🍂", "🍁", "🍃"];
  function spawnLeaf() {
    const l = document.createElement("span");
    l.className = "leaf";
    l.textContent = leafIcons[Math.floor(Math.random() * leafIcons.length)];
    l.style.left = Math.random() * 100 + "vw";
    l.style.fontSize = 16 + Math.random() * 18 + "px";
    l.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
    l.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    l.style.animationDuration = 6 + Math.random() * 6 + "s";
    leafBox.appendChild(l);
    l.addEventListener("animationend", () => l.remove());
  }
  setInterval(spawnLeaf, 500);

  // Konvertni ochish
  const env = document.getElementById("envelope");
  const card = document.getElementById("card");
  function openEnvelope() {
    env.classList.add("opened");
    setTimeout(() => {
      env.style.display = "none";
      card.classList.add("show");
      burst(25);
      typeMessage();
    }, 700);
  }
  env.addEventListener("click", openEnvelope, { once: true });
  env.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") openEnvelope(); }, { once: true });

  // Matnni yozish effekti
  const msgEl = document.getElementById("msg");
  const sigEl = document.getElementById("sig");
  const cursor = document.getElementById("cursor");
  let timer;
  function typeMessage() {
    clearTimeout(timer);
    msgEl.textContent = "";
    sigEl.classList.remove("show");
    cursor.style.display = "inline-block";
    let i = 0;
    (function step() {
      msgEl.textContent = MESSAGE.slice(0, ++i);
      if (i < MESSAGE.length) {
        timer = setTimeout(step, MESSAGE[i - 1] === "\n" ? 250 : 28);
      } else {
        cursor.style.display = "none";
        sigEl.classList.add("show");
      }
    })();
  }

  // Yurakchalar
  const heartBox = document.getElementById("hearts");
  function burst(n) {
    const icons = ["❤️", "🌷", "🌹", "✨", "💐"];
    for (let k = 0; k < n; k++) {
      setTimeout(() => {
        const h = document.createElement("span");
        h.className = "heart";
        h.textContent = icons[Math.floor(Math.random() * icons.length)];
        h.style.left = Math.random() * 100 + "vw";
        h.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
        heartBox.appendChild(h);
        h.addEventListener("animationend", () => h.remove());
      }, k * 60);
    }
  }
  document.getElementById("love").addEventListener("click", () => burst(30));
  document.getElementById("replay").addEventListener("click", typeMessage);
</script>
</body>
</html>
